<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#0F0F0D; }
  a { color:#94918A; text-decoration:none; }
  a:hover { color:#E8F0D8; }
  ::selection { background:#B9CE95; color:#12130A; }
</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@11.11.17/dist/motion.js"></script>
<script src="./site-motion.js"></script>
</helmet>

<div style="background:#0F0F0D; color:#F6F4EE; font-family:Sora,sans-serif; font-weight:300; min-height:100vh; display:flex; flex-direction:column;">

  <div style="border-bottom:1px solid #1F1E19;">
    <div style="max-width:1360px; margin:0 auto; padding:0 40px; height:66px; display:flex; align-items:center; gap:20px;">
      <a data-nav href="./Homepage.dc.html" style="display:flex; align-items:center; gap:9px; color:#F6F4EE;">
        <span style="width:16px; height:16px; border-radius:5px; background:linear-gradient(140deg,rgba(185,206,149,0.9),rgba(120,150,95,0.55)); border:1px solid rgba(185,206,149,0.5);"></span>
        <span style="font-size:16px; font-weight:500; letter-spacing:-0.01em;">Kiln</span>
      </a>
      <div style="flex:1;"></div>
      <a data-nav href="./Pricing.dc.html" style="font-size:14px;">Pricing</a>
      <a data-nav href="./Homepage.dc.html" style="font-size:14px;">Browse free</a>
    </div>
  </div>

  <div style="flex:1; display:grid; grid-template-columns:1fr 1fr; min-height:0;">

    <div style="display:flex; align-items:center; justify-content:center; padding:70px 40px;">
      <div data-hero style="width:100%; max-width:420px; display:flex; flex-direction:column; gap:18px;">
        <div style="display:flex; align-items:center; gap:8px; border:1px solid #26251F; border-radius:99px; padding:5px; align-self:flex-start;">
          <sc-for list="{{ modes }}" as="m" hint-placeholder-count="2">
            <span onClick="{{ m.pick }}" style="{{ m.style }}" style-hover="filter:brightness(1.15)" style-active="transform:translateY(1px)">{{ m.label }}</span>
          </sc-for>
        </div>
        <h1 style="font-size:38px; line-height:1.12; font-weight:500; letter-spacing:-0.03em; margin:6px 0 0; text-wrap:pretty;">{{ heading }}</h1>
        <p style="font-size:16px; line-height:1.6; color:#94918A; margin:0;">{{ sub }}</p>

        <div style="display:flex; flex-direction:column; gap:10px; margin-top:8px;">
          <span style="border:1px solid #2C2A24; border-radius:99px; padding:15px 22px; font-size:15px; color:#C9C6BE; text-align:center; cursor:pointer; transition:filter 160ms, transform 160ms, border-color 160ms;" style-hover="filter:brightness(1.15)" style-active="transform:translateY(1px)">Continue with Google</span>
          <span style="border:1px solid #2C2A24; border-radius:99px; padding:15px 22px; font-size:15px; color:#C9C6BE; text-align:center; cursor:pointer; transition:filter 160ms, transform 160ms, border-color 160ms;" style-hover="filter:brightness(1.15)" style-active="transform:translateY(1px)">Continue with GitHub</span>
        </div>

        <div style="display:flex; align-items:center; gap:14px; margin:6px 0;">
          <span style="flex:1; height:1px; background:#1F1E19;"></span>
          <span style="font-family:'Geist Mono',monospace; font-size:10px; letter-spacing:0.14em; color:#6E6B64;">OR</span>
          <span style="flex:1; height:1px; background:#1F1E19;"></span>
        </div>

        <div style="display:flex; flex-direction:column; gap:10px;">
          <span style="border:1px solid #26251F; border-radius:99px; padding:15px 22px; font-size:15px; color:#6E6B64;">you@email.com</span>
          <span style="border:1px solid #26251F; border-radius:99px; padding:15px 22px; font-size:15px; color:#6E6B64;">••••••••••</span>
          <span style="background:linear-gradient(135deg,rgba(185,206,149,0.30),rgba(185,206,149,0.11)); border:1px solid rgba(185,206,149,0.45); backdrop-filter:blur(8px); color:#E8F0D8; font-size:15px; font-weight:500; border-radius:99px; padding:16px 22px; text-align:center; cursor:pointer; transition:filter 160ms, transform 160ms, border-color 160ms;" style-hover="filter:brightness(1.15)" style-active="transform:translateY(1px)">{{ cta }}</span>
        </div>

        <span style="font-size:13px; line-height:1.6; color:#6E6B64; margin-top:4px;">{{ fine }}</span>
      </div>
    </div>

    <div style="border-left:1px solid #1F1E19; background:radial-gradient(120% 80% at 80% 10%,rgba(185,206,149,0.12),rgba(15,15,13,0) 60%),#111110; display:flex; align-items:center; justify-content:center; padding:70px 40px;">
      <div data-reveal style="width:100%; max-width:460px; display:flex; flex-direction:column; gap:20px;">

        <div data-card data-chip="{{ chip }}" style="border-radius:13px; padding:5px;">
          <div style="height:240px; border-radius:9px; overflow:hidden; position:relative;">
            <div data-preview-inner style="width:100%; height:100%; background:linear-gradient(150deg,#1D2410,#0F0F0D 62%); will-change:transform;"></div>
            <sc-if value="{{ locked }}" hint-placeholder-val="{{ true }}">
              <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(11,11,10,0.55); backdrop-filter:blur(3px);">
                <span style="font-family:'Geist Mono',monospace; font-size:10px; letter-spacing:0.16em; color:#E8F0D8; border:1px solid rgba(185,206,149,0.45); background:linear-gradient(135deg,rgba(185,206,149,0.26),rgba(185,206,149,0.09)); border-radius:99px; padding:9px 18px;">UNLIMITED ONLY</span>
              </div>
            </sc-if>
          </div>
          <div style="display:flex; align-items:center; gap:11px; padding:16px 4px 0;">
            <span style="font-size:17px; font-weight:500; letter-spacing:-0.01em;">Volumetric Drift</span>
            <span style="font-size:12px; color:#94918A; background:rgba(246,244,238,0.05); border:1px solid #23221C; border-radius:99px; padding:5px 13px;">Unlimited</span>
          </div>
          <div style="display:flex; gap:8px; padding:11px 4px 2px;">
            <span style="font-size:12px; color:#94918A; background:rgba(246,244,238,0.05); border:1px solid #23221C; border-radius:99px; padding:6px 13px;">3d scene</span>
            <span style="font-size:12px; color:#94918A; background:rgba(246,244,238,0.05); border:1px solid #23221C; border-radius:99px; padding:6px 13px;">three.js</span>
          </div>
        </div>

        <div style="border-radius:13px; border:1px solid #26251F; background:#141412; padding:24px; display:flex; flex-direction:column; gap:14px;">
          <span style="font-family:'Geist Mono',monospace; font-size:10px; letter-spacing:0.14em; color:#B9CE95;">WHAT UNLIMITED OPENS</span>
          <sc-for list="{{ perks }}" as="p" hint-placeholder-count="4">
            <div style="display:flex; gap:11px; align-items:flex-start;">
              <span style="font-size:12px; color:#B9CE95; padding-top:3px;">✦</span>
              <span style="font-size:15px; line-height:1.5; color:#E4E1D9;">{{ p }}</span>
            </div>
          </sc-for>
          <div style="height:1px; background:#232219; margin-top:4px;"></div>
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <span style="font-size:15px; color:#94918A;">$24 a month, cancel anytime</span>
            <a data-nav href="./Pricing.dc.html" style="font-size:14px; color:#E8F0D8;">See pricing →</a>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { mode:"Create account" };
  componentDidMount() { if (window.KilnMotion) window.KilnMotion.init(); }

  renderVals() {
    const { mode } = this.state;
    const signup = mode === "Create account";
    const seg = a => "font-size:13px; font-weight:500; border-radius:99px; padding:9px 18px; cursor:pointer; transition:all 160ms;" +
      (a ? "background:linear-gradient(135deg,rgba(185,206,149,0.28),rgba(185,206,149,0.10)); border:1px solid rgba(185,206,149,0.42); color:#E8F0D8;"
         : "border:1px solid transparent; color:#94918A;");

    return {
      modes: ["Create account","Sign in"].map(m => ({
        label: m, style: seg(mode === m), pick: () => this.setState({ mode: m })
      })),
      heading: signup ? "Start with twelve free assets." : "Welcome back.",
      sub: signup
        ? "No card needed. Upgrade whenever you hit something behind the paywall."
        : "Sign in to reach your downloads, saved collections and invoices.",
      cta: signup ? "Create free account" : "Sign in",
      fine: signup
        ? "By creating an account you agree to the license terms. One email a week, nothing else."
        : "Trouble signing in? Ask for a magic link instead.",
      locked: signup,
      chip: signup ? "UNLIMITED ONLY" : "FREE PREVIEW",
      perks: [
        "All 240 assets and every source file",
        "Nine new assets every Thursday",
        "All 18 collections",
        "Commercial use in unlimited client projects"
      ]
    };
  }
}
</script>
</body>
</html>
